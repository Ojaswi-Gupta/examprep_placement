<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 8; }
      .text-title { font-family: sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #212529; }
      .text-sub { font-family: sans-serif; font-size: 14px; text-anchor: middle; fill: #6c757d; }
      .arrow { stroke: #007bff; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff" />
    </marker>
  </defs>

  <rect x="50" y="50" width="700" height="220" class="box" fill="#e9ecef" stroke-dasharray="5"/>
  <text x="400" y="80" class="text-title">GitHub Actions Workflow</text>
  <text x="400" y="105" class="text-sub">Triggered by an Event (e.g., push to main)</text>

  <!-- Job 1 -->
  <rect x="100" y="130" width="180" height="120" class="box" />
  <text x="190" y="155" class="text-title">Job: Build</text>
  <rect x="120" y="175" width="140" height="25" rx="4" fill="#007bff" /> <text x="190" y="188" class="text-sub" fill="#fff">Step 1: Checkout</text>
  <rect x="120" y="210" width="140" height="25" rx="4" fill="#007bff" /> <text x="190" y="223" class="text-sub" fill="#fff">Step 2: npm run build</text>

  <line x1="280" y1="190" x2="350" y2="190" class="arrow" />

  <!-- Job 2 -->
  <rect x="360" y="130" width="180" height="120" class="box" />
  <text x="450" y="155" class="text-title">Job: Test</text>
  <rect x="380" y="175" width="140" height="25" rx="4" fill="#28a745" /> <text x="450" y="188" class="text-sub" fill="#fff">Step 1: Setup Node</text>
  <rect x="380" y="210" width="140" height="25" rx="4" fill="#28a745" /> <text x="450" y="223" class="text-sub" fill="#fff">Step 2: npm test</text>

  <line x1="540" y1="190" x2="610" y2="190" class="arrow" />

  <!-- Job 3 -->
  <rect x="620" y="130" width="100" height="120" class="box" />
  <text x="670" y="155" class="text-title">Deploy</text>
  <rect x="630" y="190" width="80" height="40" rx="4" fill="#dc3545" /> <text x="670" y="210" class="text-sub" fill="#fff">To Prod</text>

</svg>
