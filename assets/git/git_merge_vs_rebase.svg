<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .node { fill: #007bff; stroke: #fff; stroke-width: 3; }
      .node-feat { fill: #28a745; stroke: #fff; stroke-width: 3; }
      .node-merge { fill: #dc3545; stroke: #fff; stroke-width: 3; }
      .text { font-family: sans-serif; font-size: 14px; fill: #333; font-weight: bold; }
      .text-title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #212529; }
      .edge { stroke: #6c757d; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>

  <!-- Title Left -->
  <text x="200" y="40" class="text-title" text-anchor="middle">Git Merge</text>
  <text x="200" y="60" class="text" text-anchor="middle" fill="#6c757d">Creates a new merge commit.</text>
  
  <!-- Left Side: Merge -->
  <g transform="translate(50, 100)">
    <!-- Main branch -->
    <line x1="50" y1="50" x2="150" y2="50" class="edge" />
    <line x1="150" y1="50" x2="250" y2="50" class="edge" />
    
    <circle cx="50" cy="50" r="15" class="node" /> <text x="50" y="80" class="text" text-anchor="middle">A</text>
    <circle cx="150" cy="50" r="15" class="node" /> <text x="150" y="80" class="text" text-anchor="middle">B</text>
    
    <!-- Feature branch -->
    <line x1="50" y1="50" x2="100" y2="150" class="edge" />
    <line x1="100" y1="150" x2="200" y2="150" class="edge" />
    
    <circle cx="100" cy="150" r="15" class="node-feat" /> <text x="100" y="180" class="text" text-anchor="middle">C</text>
    <circle cx="200" cy="150" r="15" class="node-feat" /> <text x="200" y="180" class="text" text-anchor="middle">D</text>
    
    <!-- Merge commit -->
    <line x1="200" y1="150" x2="250" y2="50" class="edge" />
    <circle cx="250" cy="50" r="15" class="node-merge" /> <text x="250" y="80" class="text" text-anchor="middle">M (Merge)</text>
  </g>


  <!-- Line Divider -->
  <line x1="400" y1="20" x2="400" y2="380" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10" />

  <!-- Title Right -->
  <text x="600" y="40" class="text-title" text-anchor="middle">Git Rebase</text>
  <text x="600" y="60" class="text" text-anchor="middle" fill="#6c757d">Rewrites history. Moves base.</text>

  <!-- Right Side: Rebase -->
  <g transform="translate(450, 100)">
    <!-- Main branch -->
    <line x1="50" y1="50" x2="150" y2="50" class="edge" />
    
    <circle cx="50" cy="50" r="15" class="node" /> <text x="50" y="80" class="text" text-anchor="middle">A</text>
    <circle cx="150" cy="50" r="15" class="node" /> <text x="150" y="80" class="text" text-anchor="middle">B</text>
    
    <!-- Original branch (ghosted) -->
    <line x1="50" y1="50" x2="100" y2="150" stroke="#ccc" stroke-width="4" stroke-dasharray="5" />
    <line x1="100" y1="150" x2="200" y2="150" stroke="#ccc" stroke-width="4" stroke-dasharray="5" />
    <circle cx="100" cy="150" r="15" fill="#e9ecef" /> <text x="100" y="180" class="text" fill="#adb5bd" text-anchor="middle">C</text>
    <circle cx="200" cy="150" r="15" fill="#e9ecef" /> <text x="200" y="180" class="text" fill="#adb5bd" text-anchor="middle">D</text>

    <!-- Rebased branch -->
    <line x1="150" y1="50" x2="250" y2="50" class="edge" />
    <line x1="250" y1="50" x2="350" y2="50" class="edge" />
    <circle cx="250" cy="50" r="15" class="node-feat" /> <text x="250" y="80" class="text" text-anchor="middle">C'</text>
    <circle cx="350" cy="50" r="15" class="node-feat" /> <text x="350" y="80" class="text" text-anchor="middle">D'</text>
  </g>

</svg>
