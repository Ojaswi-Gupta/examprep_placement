<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 8; }
      .box-remote { fill: #e9ecef; stroke: #495057; stroke-width: 2; rx: 8; stroke-dasharray: 5; }
      .text-title { font-family: sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #212529; }
      .text-sub { font-family: sans-serif; font-size: 12px; text-anchor: middle; fill: #6c757d; }
      .arrow { stroke: #007bff; stroke-width: 3; marker-end: url(#arrowhead); fill: transparent; }
      .arrow-label { font-family: monospace; font-size: 14px; fill: #007bff; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff" />
    </marker>
  </defs>

  <!-- Zones -->
  <rect x="50" y="50" width="150" height="100" class="box" />
  <text x="125" y="90" class="text-title">Working Dir</text>
  <text x="125" y="115" class="text-sub">Your actual files</text>

  <rect x="250" y="50" width="150" height="100" class="box" />
  <text x="325" y="90" class="text-title">Staging Area</text>
  <text x="325" y="115" class="text-sub">Index (.git/index)</text>

  <rect x="450" y="50" width="150" height="100" class="box" />
  <text x="525" y="90" class="text-title">Local Repo</text>
  <text x="525" y="115" class="text-sub">Committed (.git)</text>

  <rect x="650" y="50" width="150" height="100" class="box-remote" />
  <text x="725" y="90" class="text-title">Remote Repo</text>
  <text x="725" y="115" class="text-sub">GitHub / GitLab</text>

  <!-- Arrows Top -->
  <path d="M 125 50 Q 225 10 325 50" class="arrow" />
  <text x="225" y="25" class="arrow-label">git add</text>

  <path d="M 325 50 Q 425 10 525 50" class="arrow" />
  <text x="425" y="25" class="arrow-label">git commit</text>

  <path d="M 525 50 Q 625 10 725 50" class="arrow" />
  <text x="625" y="25" class="arrow-label">git push</text>

  <!-- Arrows Bottom -->
  <path d="M 725 150 Q 625 190 525 150" class="arrow" />
  <text x="625" y="190" class="arrow-label">git fetch</text>

  <path d="M 525 150 Q 325 210 125 150" class="arrow" />
  <text x="325" y="200" class="arrow-label">git merge</text>

  <path d="M 725 150 Q 425 250 125 150" class="arrow" stroke="#28a745" fill="transparent" marker-end="url(#arrowhead)" />
  <text x="425" y="230" class="arrow-label" fill="#28a745">git pull (fetch + merge)</text>
</svg>
