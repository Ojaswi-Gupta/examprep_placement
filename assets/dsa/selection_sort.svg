<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f0f0f0; stroke: #333; stroke-width: 2; rx: 4; }
      .text { font-family: monospace; font-size: 20px; text-anchor: middle; dominant-baseline: middle; fill: #333; }
      .box-sorted { fill: #d4edda; stroke: #28a745; }
      .box-current { fill: #fff3cd; stroke: #ffc107; }
      .box-min { fill: #cce5ff; stroke: #007bff; }
      .label { font-family: sans-serif; font-size: 14px; fill: #666; }
      .arrow { stroke: #e53e3e; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e" />
    </marker>
  </defs>
  
  <!-- Step 1: Initial -->
  <text x="50" y="30" class="label">Step 1: Find min</text>
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="40" height="40" class="box box-current"/> <text x="20" y="20" class="text">9</text>
    <rect x="50" y="0" width="40" height="40" class="box"/> <text x="70" y="20" class="text">4</text>
    <rect x="100" y="0" width="40" height="40" class="box"/> <text x="120" y="20" class="text">7</text>
    <rect x="150" y="0" width="40" height="40" class="box box-min"/> <text x="170" y="20" class="text">2</text>
    <rect x="200" y="0" width="40" height="40" class="box"/> <text x="220" y="20" class="text">8</text>
  </g>
  <path d="M 70 45 Q 140 10 220 45" class="arrow" fill="transparent"/>
  
  <!-- Step 2: Swapped -->
  <text x="350" y="30" class="label">Step 2: Swap min to front</text>
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="40" height="40" class="box box-sorted"/> <text x="20" y="20" class="text">2</text>
    <rect x="50" y="0" width="40" height="40" class="box"/> <text x="70" y="20" class="text">4</text>
    <rect x="100" y="0" width="40" height="40" class="box"/> <text x="120" y="20" class="text">7</text>
    <rect x="150" y="0" width="40" height="40" class="box"/> <text x="170" y="20" class="text">9</text>
    <rect x="200" y="0" width="40" height="40" class="box"/> <text x="220" y="20" class="text">8</text>
  </g>
  
  <text x="50" y="130" class="label">Legend: </text>
  <rect x="110" y="115" width="20" height="20" class="box box-current"/> <text x="135" y="125" class="label" text-anchor="start">Current Position</text>
  <rect x="260" y="115" width="20" height="20" class="box box-min"/> <text x="285" y="125" class="label" text-anchor="start">Found Minimum</text>
  <rect x="410" y="115" width="20" height="20" class="box box-sorted"/> <text x="435" y="125" class="label" text-anchor="start">Sorted Subarray</text>

</svg>
