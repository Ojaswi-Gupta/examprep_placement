<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <style>
      .node { fill: #fff; stroke: #007bff; stroke-width: 2; }
      .text { font-family: monospace; font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #333; font-weight: bold; }
      .edge { stroke: #666; stroke-width: 2; }
      .edge-weight { font-family: sans-serif; font-size: 14px; fill: #e53e3e; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Edges -->
  <line x1="100" y1="150" x2="250" y2="50" class="edge" />
  <text x="160" y="85" class="edge-weight">4</text>
  
  <line x1="100" y1="150" x2="250" y2="250" class="edge" />
  <text x="160" y="215" class="edge-weight">2</text>
  
  <line x1="250" y1="50" x2="400" y2="150" class="edge" />
  <text x="340" y="85" class="edge-weight">5</text>
  
  <line x1="250" y1="250" x2="400" y2="150" class="edge" />
  <text x="340" y="215" class="edge-weight">1</text>
  
  <line x1="250" y1="50" x2="250" y2="250" class="edge" />
  <text x="260" y="150" class="edge-weight">3</text>

  <!-- Nodes -->
  <circle cx="100" cy="150" r="20" class="node" /> <text x="100" y="150" class="text">A</text>
  <circle cx="250" cy="50" r="20" class="node" /> <text x="250" y="50" class="text">B</text>
  <circle cx="250" cy="250" r="20" class="node" /> <text x="250" y="250" class="text">C</text>
  <circle cx="400" cy="150" r="20" class="node" /> <text x="400" y="150" class="text">D</text>

  <text x="250" y="290" style="font-family: sans-serif; font-size: 14px; text-anchor: middle; fill: #555;">Weighted Undirected Graph</text>
</svg>
