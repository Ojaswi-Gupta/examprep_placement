<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      .node { fill: #fff; stroke: #007bff; stroke-width: 2; }
      .text { font-family: monospace; font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #333; font-weight: bold; }
      .edge { stroke: #666; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Edges -->
  <line x1="200" y1="50" x2="100" y2="120" class="edge" />
  <line x1="200" y1="50" x2="300" y2="120" class="edge" />
  
  <line x1="100" y1="120" x2="50" y2="190" class="edge" />
  <line x1="100" y1="120" x2="150" y2="190" class="edge" />
  
  <line x1="300" y1="120" x2="250" y2="190" class="edge" />
  <line x1="300" y1="120" x2="350" y2="190" class="edge" />

  <!-- Nodes -->
  <!-- Root -->
  <circle cx="200" cy="50" r="20" class="node" /> <text x="200" y="50" class="text">50</text>
  
  <!-- Level 1 -->
  <circle cx="100" cy="120" r="20" class="node" /> <text x="100" y="120" class="text">30</text>
  <circle cx="300" cy="120" r="20" class="node" /> <text x="300" y="120" class="text">70</text>
  
  <!-- Level 2 -->
  <circle cx="50" cy="190" r="20" class="node" /> <text x="50" y="190" class="text">20</text>
  <circle cx="150" cy="190" r="20" class="node" /> <text x="150" y="190" class="text">40</text>
  
  <circle cx="250" cy="190" r="20" class="node" /> <text x="250" y="190" class="text">60</text>
  <circle cx="350" cy="190" r="20" class="node" /> <text x="350" y="190" class="text">80</text>

  <text x="200" y="260" style="font-family: sans-serif; font-size: 14px; text-anchor: middle; fill: #555;">Binary Search Tree (Left child < Parent < Right child)</text>
</svg>
